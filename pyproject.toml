[project]
name = "socratic-python-debugger"
version = "0.1.0"
description = "Socratic tutor for beginner Python debugging, fine-tuned with LoRA and served with an LLMOps flow"
readme = "README.md"
requires-python = ">=3.11.6"
dependencies = [
    "datasets>=4.2.0",
    "fsspec>=2025.9.0",
    "gcsfs>=2025.9.0",
    "google-cloud-aiplatform>=1.120.0",
    "google-cloud-bigquery>=3.38.0",
    "google-cloud-storage>=2.19.0",
    "ipykernel>=7.0.0",
    "kfp>=2.14.6",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "peft==0.13.2",
    "pytest>=9.2.0",
    "tensorboard==2.20.0",
    "torch==2.8.0",
    "transformers==4.46.*",
    "trl==0.12.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
